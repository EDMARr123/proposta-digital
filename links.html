<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Links da Proposta</title>
<style>
:root{--red:#c8102e;--ink:#241a17;--muted:#74655f;--line:#ecdcd8;--bg:#f6f2ef;--green:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px 12px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px rgba(0,0,0,.15)}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em}
.sub{margin-top:3px;font-size:12px;opacity:.88}
.busca{display:block;width:100%;max-width:520px;margin:10px auto 0;min-height:40px;padding:8px 14px;border:0;border-radius:999px;font:inherit;font-size:15px}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.sup{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.sup h2{margin:0;padding:10px 12px 10px 14px;background:#fff3f4;color:var(--red);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vd{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 14px;border-top:1px solid var(--line)}
.vd .nm{flex:1;min-width:0}
.vd .nm b{display:block;font-size:15px;font-weight:800}
.vd .nm small{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{flex:none;min-height:38px;padding:6px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:900;cursor:pointer}
.cp{border:1.5px solid var(--red);background:#fff;color:var(--red)}
.wa{border:0;background:var(--green);color:#fff}
.todos{border:1.5px solid var(--red);background:var(--red);color:#fff;font-size:12px;min-height:34px}
button.ok{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.vd.oculto,.sup.oculto{display:none}
.rodape{margin-top:18px;text-align:center;font-size:13px}
.rodape a{color:var(--red);font-weight:800}
@media(max-width:420px){button{padding:6px 9px}.vd{gap:6px}}
</style>
</head>
<body>
<header>
  <h1>LINKS DA PROPOSTA DIGITAL</h1>
  <div class="sub">Cada vendedor recebe o link dele · o uso aparece no painel de uso</div>
  <input class="busca" id="busca" type="search" placeholder="Buscar vendedor ou RCA..." autocomplete="off">
</header>
<main>
  <div id="lista"></div>
  <p class="rodape"><a href="uso.html">Abrir o painel de uso →</a></p>
</main>
<script>
var SITE="https://edmarr123.github.io/proposta-digital/", VEND={"15": ["WESLEY", "LEANDRO"], "85": ["CARLOS HENRIQUE", "LEANDRO"], "81": ["LOIOLA", "LEANDRO"], "83": ["MARCOS SILVA", "LEANDRO"], "192": ["LUCAS LEAL", "LEANDRO"], "649": ["WALLACE SOUSA", "LEANDRO"], "650": ["ANDRE WILKER", "LEANDRO"], "12": ["FABIANO", "FLAVIANE"], "471": ["ANTONIO EDVALDO", "FLAVIANE"], "383": ["GABRIEL LOURENCO", "FLAVIANE"], "377": ["CELISMAR", "FLAVIANE"], "657": ["YURI ENRIQUE", "FLAVIANE"], "796": ["HAMAURY SENA", "FLAVIANE"], "797": ["GLEIBSON B.", "FLAVIANE"], "738": ["MARCEL HENRIQUE", "IDEGLAN"], "164": ["JOAO VITOR", "IDEGLAN"], "45": ["TIAGO", "IDEGLAN"], "428": ["TAUA F.", "IDEGLAN"], "439": ["GUILHERME AUGUSTO", "IDEGLAN"], "622": ["HAMBER", "IDEGLAN"], "722": ["LUIZ GUSTAVO", "IDEGLAN"], "16": ["BERALDO", "LUCAS"], "398": ["UCLEIBSON", "LUCAS"], "723": ["JEAN PIERRE", "LUCAS"], "729": ["MARCELO ALVES", "LUCAS"], "467": ["IGOR SA", "LUCAS"], "644": ["ALBERTO SANTOS", "LUCAS"], "698": ["FERNANDO OLIVEIRA", "LUCAS"], "42": ["PAULO RONAN", "RICHARD"], "334": ["JOAO GABRIEL", "RICHARD"], "806": ["MARCIO GABRIEL", "RICHARD"], "473": ["KAIKY DIAS", "RICHARD"], "751": ["JULIO CESAR", "RICHARD"], "679": ["RAFAEL COSTA", "RICHARD"], "802": ["SUBSTITUTO", "RICHARD"], "687": ["EDREY MARTINS", "RICHARD"], "47": ["MARCELO", "RODRIGO"], "347": ["MATIAS", "RODRIGO"], "357": ["LUCIANO", "RODRIGO"], "405": ["WILLIAN", "RODRIGO"], "561": ["THALLES VIEIRA", "RODRIGO"], "660": ["LUCAS", "RODRIGO"], "807": ["EDGARD MARLON", "RODRIGO"]}, ORDEM=["LEANDRO", "FLAVIANE", "IDEGLAN", "LUCAS", "RICHARD", "RODRIGO"];
function titulo(n){ return n.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();}); }
function link(r){ return SITE+'?rca='+r; }
function msg(r){ return 'Olá '+titulo(VEND[r][0])+'! Este é o SEU link da Proposta Digital Friato:\n'+link(r)+'\n\nUse sempre este link (salve nos favoritos ou na tela inicial do celular).'; }
var h='';
ORDEM.forEach(function(s){
  var rs=Object.keys(VEND).filter(function(r){return VEND[r][1]===s;});
  if(!rs.length) return;
  h+='<section class="sup" data-sup="'+s+'"><h2>SUP '+s+'<button type="button" class="todos" data-todos="'+s+'">Copiar todos</button></h2>';
  rs.forEach(function(r){
    h+='<div class="vd" data-busca="'+(VEND[r][0]+' '+r).toLowerCase()+'"><div class="nm"><b>'+titulo(VEND[r][0])+'</b><small>RCA '+r+' · '+link(r)+'</small></div>'+
       '<button type="button" class="cp" data-cp="'+r+'">Copiar</button><button type="button" class="wa" data-wa="'+r+'">WhatsApp</button></div>';
  });
  h+='</section>';
});
document.getElementById('lista').innerHTML=h;
function copiar(txt,b,rotulo){
  var ok=function(){ b.textContent='Copiado ✓'; b.classList.add('ok'); setTimeout(function(){ b.textContent=rotulo; b.classList.remove('ok'); },1600); };
  var velho=function(){
    var t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t);
    t.select(); var r=false; try{ r=document.execCommand('copy'); }catch(e){} document.body.removeChild(t);
    if(r) ok(); else prompt('Copie:',txt);
  };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok,velho); else velho();
}
document.getElementById('lista').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.cp) copiar(link(b.dataset.cp),b,'Copiar');
  else if(b.dataset.wa){ var u='https://wa.me/?text='+encodeURIComponent(msg(b.dataset.wa)); var w=window.open(u,'_blank'); if(!w) location.href=u; }
  else if(b.dataset.todos){
    var s=b.dataset.todos, t='*PROPOSTA DIGITAL FRIATO — LINKS DA EQUIPE '+s+'*\nCada um usa o SEU link:\n';
    Object.keys(VEND).forEach(function(r){ if(VEND[r][1]===s) t+='\n'+titulo(VEND[r][0])+': '+link(r); });
    copiar(t,b,'Copiar todos');
  }
});
document.getElementById('busca').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  [].forEach.call(document.querySelectorAll('.vd'),function(v){ v.classList.toggle('oculto',!!q&&v.dataset.busca.indexOf(q)<0); });
  [].forEach.call(document.querySelectorAll('.sup'),function(s){ s.classList.toggle('oculto',!s.querySelector('.vd:not(.oculto)')); });
});
</script>
</body>
</html>
